# Shown under the tagline on the opening screen.
intro: >
  We use molecular biology, biochemistry, and animal modeling to investigate
  mechanisms underlying human genetic disorders. We are particularly interested
  in rare Mendelian diseases that dysregulate the biogenesis and function of
  specialized cells and subcellular compartments.

hero_image: images/hero.jpg
hero_alt: Scanning electron micrograph of airway cilia

# Research section lead paragraphs. Markdown links like [text](url) work.
research_intro:
  - >
    Our lab is grounded in the belief that rare human genetic disorders can
    illuminate fundamental principles in cell biology and reveal new treatments
    for common and uncommon disease alike. These ideas have already paid huge
    dividends in heart disease and cancer and are growing in scope as medical
    practice increasingly incorporates molecular genetics.
  - >
    We are currently most interested in monogenic disorders of proteostasis and
    organelle quality control. Proteostasis and organellar defects, often
    manifested by subcellular protein aggregation, are common during aging and
    across diverse human disease states, yet their molecular basis is hard to
    uncover because model systems are limited and the initiating events in
    complex, often age-related disease are poorly understood. We take a
    genetics-driven approach: we study human syndromes that phenocopy sporadic
    proteostasis and organellar diseases but have a single defined cause that is
    amenable to mechanistic work in the laboratory, using cultured immortalized
    cells, primary human stem cell cultures, and mouse models together with
    biochemistry, mass spectrometry, advanced microscopy, and functional genomics.

